stages:
  - setup
  - code-compliance
  - security-compliance
  - test
  - reports

vault-plain-code-compliance:
  stage: code-compliance
  image: bash:latest
  before_script:
    - apk add --no-cache jq
  script:
    - bash ./ci/scripts/check-plain-compliance.sh
    - bash ./ci/scripts/check-ipynb-compliance.sh
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

vault-python-code-compliance:
  stage: code-compliance
  image: python:3.12-slim
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip setuptools
    - pip install -r requirements-dev.txt
    - pip install -e .
  script:
    - black --check .
    - mypy .
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

vault-check-outdated-dependencies:
  stage: code-compliance
  image: python:3.12-slim
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip setuptools
    - pip install -r requirements-dev.txt
    - pip install -e .
  script:
    - |
      # Get outdated packages and filter out allowed ones
      outdated=$(pip list --outdated | tail -n +3 | while read -r package rest; do
        if ! grep -q "^$package\$\|^${package%%-*}-\*$" .allowed_outdated_dependencies 2>/dev/null; then
          echo "$package $rest"
        fi
      done)
    - |
      if [ -n "$outdated" ]; then
        echo "Found non-allowed outdated packages:"
        echo "$outdated"
        exit 1
      fi
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

vault-documentation:
  stage: reports
  image: 123marvin123/typst:latest
  script:
    - mkdir -p output-assets/documentation
    - export COMMIT_HASH=${CI_COMMIT_SHORT_SHA}
    - export TYPST_FONT_PATHS=documentation/common/fonts
    - typst fonts
    - typst compile documentation/sink.typ output-assets/documentation/sink-${COMMIT_HASH}.pdf
    - typst compile documentation/csds-352-vault.typ output-assets/documentation/csds-352-vault-${COMMIT_HASH}.pdf
  artifacts:
    paths:
      - output-assets/documentation/*.pdf
    expire_in: never
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

capstone-pipeline:
  stage: test
  image: python:3.12-slim
  variables:
    HF_HOME: $CI_PROJECT_DIR/.hf-cache
  cache:
    key:
      files:
        - capstone/pyproject.toml
    paths:
      - .hf-cache
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip setuptools
    - pip install -r requirements-dev.txt
    - pip install -e .
    - pip install --no-deps -e ./capstone
    - >-
      pip install
      "numpy==1.26.4"
      "pypdf==6.19.0"
      "pdfplumber==0.11.10"
      "chromadb==0.5.5"
      "posthog>=2,<3"
      "hdbscan==0.8.39"
      "sentence-transformers==5.1.2"
      "umap-learn==0.5.9.post2"
      "pydantic==2.9.0"
      "pydantic-settings==2.5.0"
  script:
    - cd capstone
    - pytest tests/ -v --tb=short
    - python -m cli.main pipeline -i tests/fixtures/tst-sample.pdf
    - python -m cli.main stats
    - python -m cli.main search "insalubridade" --k 3
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
