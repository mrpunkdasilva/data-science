[mypy]
python_version = 3.12
strict = true
disallow_subclassing_any = false
mypy_path = capstone/src
files = capstone/src
namespace_packages = true
explicit_package_bases = true
exclude = .venv|venv|build|dist|node_modules|site-packages|__pycache__

[mypy-pydantic_settings]
ignore_missing_imports = true

[mypy-pydantic_settings.*]
ignore_missing_imports = true

[mypy-datasets]
ignore_missing_imports = true

[mypy-datasets.*]
ignore_missing_imports = true

[mypy-chromadb]
ignore_missing_imports = true

[mypy-chromadb.*]
ignore_missing_imports = true

[mypy-hdbscan]
ignore_missing_imports = true

[mypy-hdbscan.*]
ignore_missing_imports = true

[mypy-umap]
ignore_missing_imports = true

[mypy-umap.*]
ignore_missing_imports = true

[mypy-sentence_transformers]
ignore_missing_imports = true

[mypy-sentence_transformers.*]
ignore_missing_imports = true

[mypy-transformers]
ignore_missing_imports = true

[mypy-transformers.*]
ignore_missing_imports = true

[mypy-sklearn]
ignore_missing_imports = true

[mypy-sklearn.*]
ignore_missing_imports = true

[mypy-joblib]
ignore_missing_imports = true

[mypy-joblib.*]
ignore_missing_imports = true

[mypy-pandas]
ignore_missing_imports = true

[mypy-pandas.*]
ignore_missing_imports = true

[mypy-typer]
ignore_missing_imports = true

[mypy-typer.*]
ignore_missing_imports = true

[mypy-pydantic]
ignore_missing_imports = true

[mypy-pydantic.*]
ignore_missing_imports = true

[mypy-streamlit]
ignore_missing_imports = true

[mypy-streamlit.*]
ignore_missing_imports = true

[mypy-plotly]
