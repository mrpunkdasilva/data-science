[build-system]
requires = ["setuptools >= 69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csds-352-vault"
version = "0.0.1"
description = "Data Science and Machine Learning Vault"
authors = [{name = "Jala R&D", email = "RD_GenerativeAI@jalasoft.com"}]
license = {file = "LICENSE"}
requires-python = ">=3.12"

dependencies = [
  "ipykernel==6.29.5",
  "ipympl==0.9.6",
  "matplotlib==3.10.0",
  "numpy==2.2.3",
  "pandas==2.2.3",
  "rich==13.9.4",
  "scikit-learn==1.6.1",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "seaborn==0.13.2"
]

[project.scripts]
csds-352-vault = "app.main:main"

[tool.setuptools]
package-dir = { "" = "capstone/src" }

[tool.setuptools.packages.find]
where = ["capstone/src"]
include = ["app*", "lib*"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "capstone/src"
files = ["capstone/src"]
namespace_packages = true
explicit_package_bases = true
exclude = ['(^|/)(\.venv|venv|build|dist|node_modules|site-packages|__pycache__)/']

[tool.black]
extend-exclude = '\.ipynb$'
